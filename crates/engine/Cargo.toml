[package]
name = "engine"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "RiskANN engine: collections, ID mapping, indexing, retrieval, ingestion jobs and benchmarks."
license = "MIT"
autobins = false

[dependencies]
storage = { path = "../storage", default-features = false }
riskann-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }

[[bin]]
name = "riskann-bench"
path = "src/bin/riskann_bench.rs"

[features]
default = ["mmap"]
mmap = ["storage/mmap"]
buffered = ["storage/disk"]
direct-io = ["storage/direct-io"]
io-uring = ["storage/io-uring"]
