[package]
name = "storage"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "RiskANN memory-mapped vector and adjacency storage."
license = "MIT"

[dependencies]
memmap2 = { workspace = true, optional = true }
bytemuck = { workspace = true }
io-uring = { version = "0.7", optional = true }
libc = { version = "0.2", optional = true }

[features]
default = ["mmap"]
disk = []
mmap = ["dep:memmap2"]
io-uring = ["disk", "dep:io-uring"]
direct-io = ["disk", "dep:libc"]
